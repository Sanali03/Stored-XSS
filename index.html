<!DOCTYPE html>
<html>
<head>
    <title>Stored XSS Demo</title>
</head>
<body>
    <h2>Guestbook</h2>
    <form onsubmit="saveComment(event)">
        <textarea id="comment" placeholder="Write your comment..."></textarea><br>
        <button type="submit">Post</button>
    </form>

    <div id="comments"></div>

    <script>
        function saveComment(e) {
            e.preventDefault();
            const c = document.getElementById("comment").value;
            const comments = JSON.parse(localStorage.getItem("xss_comments") || "[]");
            comments.push(c);
            localStorage.setItem("xss_comments", JSON.stringify(comments));
            location.reload();
        }

        const stored = JSON.parse(localStorage.getItem("xss_comments") || "[]");
        const container = document.getElementById("comments");

        stored.forEach(comment => {
            const div = document.createElement("div");
            div.innerHTML = comment; // vulnerable to XSS
            container.appendChild(div);
        });

        // Inject flag when XSS triggers custom function
        function showFlag() {
            alert("THM{Stored_XSS_Flag}");
        }
    </script>
</body>
</html>
