<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stored XSS Demo</title>
    <script>
        // ✅ Must be globally defined before any script injection
        function showFlag() {
            alert("THM{Stored_XSS_Flag}");
        }
    </script>
</head>
<body>
    <h2>Guestbook</h2>

    <form onsubmit="saveComment(event)">
        <textarea id="comment" placeholder="Write your comment..."></textarea><br>
        <button type="submit">Post</button>
    </form>

    <div id="comments"></div>

    <script>
        function saveComment(e) {
            e.preventDefault();
            const comment = document.getElementById("comment").value;
            const comments = JSON.parse(localStorage.getItem("comments") || "[]");
            comments.push(comment);
            localStorage.setItem("comments", JSON.stringify(comments));
            location.reload();
        }

        const storedComments = JSON.parse(localStorage.getItem("comments") || "[]");
        const commentContainer = document.getElementById("comments");

        storedComments.forEach(c => {
            const wrapper = document.createElement("div");
            wrapper.innerHTML = c; // ⚠️ XSS injection point
            commentContainer.appendChild(wrapper);
        });
    </script>
</body>
</html>
