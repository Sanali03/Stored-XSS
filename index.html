<!DOCTYPE html>
<html>
<head>
    <title>Stored XSS Challenge</title>
</head>
<body>
    <h2>Guestbook</h2>

    <form onsubmit="saveComment(event)">
        <textarea id="comment" placeholder="Write your comment..."></textarea><br>
        <button type="submit">Post</button>
    </form>

    <div id="comments"></div>

    <!-- Define globally accessible function -->
    <script>
        window.showFlag = function () {
            alert("THM{Stored_XSS_Flag}");
        };
    </script>

    <!-- Render stored comments and allow execution -->
    <script>
        function saveComment(e) {
            e.preventDefault();
            const input = document.getElementById("comment").value;
            const comments = JSON.parse(localStorage.getItem("comments") || "[]");
            comments.push(input);
            localStorage.setItem("comments", JSON.stringify(comments));
            location.reload();
        }

        const comments = JSON.parse(localStorage.getItem("comments") || "[]");
        const container = document.getElementById("comments");

        comments.forEach(c => {
            const wrapper = document.createElement("div");
            wrapper.innerHTML = c;
            container.appendChild(wrapper);
        });
    </script>
</body>
</html>
